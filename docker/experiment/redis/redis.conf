# ============================================================
# 실험용 Redis 설정 — 캐시 거동을 왜곡 없이 관측
# ============================================================

# slowlog: 0us 이상 모든 명령 기록(미스 폭주 시 직렬화 비용 관측)
slowlog-log-slower-than 0
slowlog-max-len 1024

# 영속화 끄기: 측정 노이즈(디스크 fsync) 제거. 실험 데이터는 휘발돼도 무방.
save ""
appendonly no

# maxmemory 미설정: 캐시 메모리 증가(O(G²) 블롭)를 그대로 관측한다.
# eviction이 끼면 hit/miss 측정이 오염되므로 일부러 제한하지 않는다.
maxmemory-policy noeviction

loglevel notice
