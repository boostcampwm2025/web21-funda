version: '3.9'

services:
  mysql:
    image: mysql:8.4
    container_name: funda-mysql
    env_file:
     - ../../.env
    environment:
      MYSQL_DATABASE: funda
      # 수동 배포에서도 deploy compose와 같은 루트 .env 값을 사용한다.
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_RANDOM_ROOT_PASSWORD: 'yes'
      TZ: Asia/Seoul
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u${DB_USER}', '-p${DB_PASSWORD}']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: funda-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    networks:
      - default
      - funda-network
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ../../
      dockerfile: docker/production/Dockerfile.backend
    container_name: funda-backend
    env_file:
      - ../../apps/backend/.env.production
    environment:
      NODE_ENV: production
      CLIENT_ORIGIN: https://funda.website
    ports:
      - '3000:3000'
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default
      - funda-network

  frontend:
    build:
      context: ../../
      dockerfile: docker/production/Dockerfile.frontend
      args:
        VITE_API_BASE_URL: /api
        VITE_SOCKET_URL: https://funda.website
    container_name: funda-frontend
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - /root/funda-cert:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    networks:
      - default
      - funda-network

networks:
  funda-network:
    external: true

volumes:
  mysql_data:
  redis_data:
